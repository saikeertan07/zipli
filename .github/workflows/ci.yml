name: Zipli Pro Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Lint, Test, Coverage, E2E & Container Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zipli_test
          POSTGRES_USER: zipli_user
          POSTGRES_PASSWORD: zipli_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        working-directory: backend
        run: npm run format

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://zipli_user:zipli_pass@localhost:5432/zipli_test
          NODE_ENV: test
        run: npm run db:migrate

      - name: Run Tests with Strict Coverage Gates (80% Global, 95% /algo)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://zipli_user:zipli_pass@localhost:5432/zipli_test
          NODE_ENV: test
          PORT: 5002
          JWT_SECRET: zipli_test_environment_jwt_secret_min_32_characters_long
        run: npm run test:coverage

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14

      - name: Install Playwright Chromium Driver
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Multi-Viewport Suite (Desktop, Tablet, Mobile)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://zipli_user:zipli_pass@localhost:5432/zipli_test
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: zipli_test_environment_jwt_secret_min_32_characters_long
        run: npm run test:e2e

      - name: Upload Playwright Test Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: backend/test-results/
          retention-days: 14

      - name: Security Dependency Vulnerability Scan (High/Critical Break CI)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Generate Software Bill of Materials (SBOM / F-063)
        working-directory: backend
        run: npm run sbom

      - name: Verify Docker Compose Build & Boot Healthcheck
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:5001/health/readiness
          docker compose down -v
