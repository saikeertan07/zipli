<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zipli — Instant Grocery & Quick-Commerce</title>
  <meta name="author" content="Tedla Saikeertan">
  <meta name="description" content="Zipli: AI-powered, algorithm-driven instant grocery delivery in 10-15 minutes.">
  <meta name="theme-color" content="#0c831f">

  <!-- Preconnect Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css?v=2.2.0">
  <link rel="stylesheet" href="css/style.css">

  <script>
    // Self-healing cache cleanup: prune stale SW caches
    if ('caches' in window) {
      caches.keys().then(function(names) {
        names.forEach(function(name) {
          if (name !== 'zipli-pro-v8') {
            caches.delete(name);
          }
        });
      });
    }
  </script>
</head>
<body>
  <!-- Offline Alert Banner -->
  <div id="offlineBanner" class="offline-banner" role="alert">
    📡 You are currently offline. Browsing cached catalog. Cart additions will sync when reconnected.
  </div>

  <!-- Persistent Shell Outlets -->
  <div id="headerOutlet"></div>

  <!-- Dynamic Page Outlet -->
  <main id="mainOutlet" role="main">
    <div style="padding:60px; text-align:center;">
      <div class="skeleton skeleton-box" style="width:80px; height:80px; border-radius:50%; margin:0 auto 16px;"></div>
      <div class="skeleton skeleton-text" style="width:240px; margin:0 auto 8px;"></div>
      <div class="skeleton skeleton-text short" style="margin:0 auto;"></div>
    </div>
  </main>

  <!-- Side Drawers & Overlays -->
  <div id="cartDrawerOutlet"></div>
  <div id="assistantDrawerOutlet"></div>
  <div id="paymentModalOutlet"></div>
  <div id="consentBannerOutlet"></div>

  <!-- Live Toast Container (Top Layer) -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Main ES Module Application Entrypoint -->
  <script type="module" src="js/app.js?v=2.2.0"></script>
</body>
</html>
