version: '3.8'

services:
  test_postgres:
    image: pgvector/pgvector:pg16
    container_name: zipli_test_postgres
    restart: "no"
    command: postgres -c shared_buffers=128MB -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_DB: zipli_test
      POSTGRES_USER: zipli_test_user
      POSTGRES_PASSWORD: zipli_test_secure_password_123
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zipli_test_user -d zipli_test']
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - zipli_test_net

  test_redis:
    image: redis:7-alpine
    container_name: zipli_test_redis
    restart: "no"
    command: redis-server --save "" --appendonly no --requirepass test_redis_secure_pass_123
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'test_redis_secure_pass_123', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - zipli_test_net

networks:
  zipli_test_net:
    driver: bridge
